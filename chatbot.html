<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
  <title>AI Chatbot - Scoopify</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-vanilla" data-page="chatbot">
  <div class="app" id="app">
    <nav class="desktop-nav">
      <div class="nav-logo">
        <img src="assets/logo/scoopify.png" alt="Scoopify" />
      </div>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Menu Utama</a>
        <a class="nav-link" href="variants.html">Daftar Varian</a>
        <a class="nav-link" href="photobooth.html">Photobooth</a>
        <a class="nav-link active" href="chatbot.html">AI Chatbot</a>
      </div>
    </nav>

    <section class="screen chatbot chatbot-page" id="chatbot">
      <div class="chatbot-shell">
        <div class="chatbot-card">
          <div class="chatbot-panel-head">
            <div>
              <span>Scoopify Assistant</span>
              <strong>Scoopify AI</strong>
            </div>
            <small id="chatbotMode">LLM + RAG + NER</small>
          </div>

          <div class="chatbot-thread" id="chatbotThread" aria-label="Percakapan chatbot Scoopify">
            <div class="chatbot-bubble bot">
              <p>Halo, aku bisa bantu soal menu, harga, stok, AI Mood Tracker, mini game, QR ticket, photobooth, dan kemitraan Scoopify.</p>
            </div>
          </div>

          <div class="chatbot-prompts" aria-label="Contoh pertanyaan">
            <button type="button" data-chat-prompt="Harga coklat berapa dan masih ada?">Harga coklat?</button>
            <button type="button" data-chat-prompt="Rasa apa saja yang tersedia sekarang?">Stok rasa</button>
            <button type="button" data-chat-prompt="Cara pesan Scoopify gimana?">Cara pesan</button>
            <button type="button" data-chat-prompt="Gimana cara scan QR ticket?">Scan QR</button>
            <button type="button" data-chat-prompt="Aturan mini game Scoopify gimana?">Mini game</button>
            <button type="button" data-chat-prompt="Gimana cara pakai photobooth premium?">Photobooth</button>
            <button type="button" data-chat-prompt="AI Mood Tracker itu cara kerjanya gimana?">AI Mood</button>
            <button type="button" data-chat-prompt="Cara jadi mitra Scoopify gimana?">Jadi mitra</button>
          </div>

          <form class="chatbot-input-row" id="chatbotForm" data-api-url="http://127.0.0.1:8000/chat">
            <input id="chatbotInput" type="text" autocomplete="off" placeholder="Tanya soal Scoopify..." aria-label="Pesan untuk chatbot" />
            <button class="primary" id="chatbotSend" type="submit">Kirim</button>
          </form>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
