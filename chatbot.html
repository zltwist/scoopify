<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
  <title>AI Chatbot - Scoopify</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-vanilla">
  <div class="app" id="app">
    <nav class="desktop-nav">
      <div class="nav-logo">
        <img src="assets/logo/scoopify.png" alt="Scoopify" />
      </div>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Menu Utama</a>
        <a class="nav-link" href="variants.html">Daftar Varian</a>
        <a class="nav-link" href="photobooth.html">Photobooth</a>
        <a class="nav-link active" href="chatbot.html">AI Chatbot</a>
      </div>
    </nav>

    <section class="screen chatbot" id="chatbot">
      <div class="container">
        <div class="section-head">
          <h2>Scoopify AI Chat</h2>
          <p>Segera hadir.</p>
        </div>

        <div class="chatbot-card chatbot-coming-soon">
          <div class="chatbot-panel-head">
            <div>
              <span>Scoopify Assistant</span>
              <strong>Segera Hadir</strong>
            </div>
            <small>Coming Soon</small>
          </div>

          <div class="chatbot-thread" aria-label="Status chatbot Scoopify">
            <div class="chatbot-bubble bot">
              <span>Scoopify AI</span>
              <p>Fitur chat AI sedang disiapkan. Untuk sekarang, pakai AI Mood Tracker dulu buat pilih rasa.</p>
            </div>
          </div>

          <div class="chatbot-input-row" aria-label="Chatbot belum aktif">
            <span>Chatbot belum aktif.</span>
            <a class="primary nav-button-link" href="index.html#analyzer">Coba AI Mood</a>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
